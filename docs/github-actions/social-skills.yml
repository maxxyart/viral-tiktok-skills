# To enable: copy to .github/workflows/social-skills.yml with workflow-write access.
name: Validate Viral Camp social skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/sync_social_skills.py --check
      - run: python -m pip install Pillow PyYAML
      - run: python tools/validate_skills.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_social_skills.py
      - uses: actions/upload-artifact@v4
        with:
          name: social-skills-${{ matrix.os }}-${{ matrix.python }}
          path: dist/social-account-*.zip
