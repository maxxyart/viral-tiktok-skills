name: Carousel account finder tests
on:
  push:
    paths:
      - 'skills/carousel-account-finder/**'
      - '.github/workflows/carousel-account-finder-tests.yml'
  pull_request:
    paths:
      - 'skills/carousel-account-finder/**'
      - '.github/workflows/carousel-account-finder-tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s skills/carousel-account-finder/tests -v
