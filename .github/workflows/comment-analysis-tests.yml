name: Comment analysis tests
on:
  push:
    paths:
      - 'skills/social-post-comment-analysis/**'
      - '.github/workflows/comment-analysis-tests.yml'
  pull_request:
    paths:
      - 'skills/social-post-comment-analysis/**'
      - '.github/workflows/comment-analysis-tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - run: python -m unittest discover -s skills/social-post-comment-analysis/tests -v
